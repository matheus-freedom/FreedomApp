[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Função síncrona existente (generateContent, generateAudio, chat,
# translate). O limite padrão de 26s é suficiente para ela.
[functions.gemini]
  timeout = 26

# Background Function do nivelamento — gera uma variação completa
# (25 questões + áudios do listening) e grava no Firestore/Storage.
# O sufixo "-background" faz a Netlify rodá-la de forma assíncrona,
# com folga de até 15 minutos (900s). Sem isso, a geração de
# listening (5 áudios TTS) estouraria o timeout padrão.
[functions.placement-background]
  timeout = 900

# Journey to Fluency — entrega UM exercício da trilha. Busca no banco
# compartilhado (journey_bank) e só chama a IA quando ninguém ainda
# passou por aquele exercício. Uma geração de texto cabe nos 26s; por
# isso o áudio do listening ficou na função de baixo.
[functions.journey-content]
  timeout = 26

# TTS dos exercícios de listening da Journey. Background = até 15
# minutos. Roda no máximo UMA vez por exercício: o arquivo fica no
# Storage e todos os alunos seguintes tocam o mesmo áudio.
[functions.journey-audio-background]
  timeout = 900

# Fechamento diário do ranking (Hall da Fama). Roda às 03:10 UTC =
# 00:10 de Brasília, para que na segunda-feira de manhã o campeão
# da semana já esteja registrado mesmo que ninguém tenha praticado.
# Esta função só dispara a de baixo, então termina em milissegundos.
[functions.ranking-snapshot]
  schedule = "10 3 * * *"

# Apuração de fato: lê o histórico e grava o Top 3 de cada semana e
# de cada mês encerrados. Background = até 15 minutos de folga.
[functions.ranking-snapshot-background]
  timeout = 900

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
